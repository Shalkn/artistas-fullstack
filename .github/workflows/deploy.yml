# CD: imagens no GHCR + deploy na VM (SSH: git clone se necessário, pull, compose, health).
name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    name: Build e push (GHCR)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Prefixo da imagem (minúsculas)
        run: echo "REGISTRY_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Limpeza preventiva de cache Docker (runner self-hosted)
        run: |
          docker builder prune -af || true
          docker image prune -af || true

      - name: Build e push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}-api:${{ github.sha }}
            ${{ env.REGISTRY_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push Web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}-web:${{ github.sha }}
            ${{ env.REGISTRY_PREFIX }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vm:
    name: Deploy na VM (SSH)
    runs-on: [self-hosted, Linux, X64]
    needs: [publish-ghcr]
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_DOTENV: ${{ secrets.DEPLOY_DOTENV }}
      COMPOSE_OPTS: "-f docker-compose.yml -f docker-compose.prod.yml"
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,DEPLOY_DOTENV,COMPOSE_OPTS
          script_stop: true
          script: |
            set -euo pipefail
            REPO_URL="https://github.com/${{ github.repository }}.git"
            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "DEPLOY_PATH vazio"
              exit 1
            fi
            if [ -z "${DEPLOY_DOTENV:-}" ]; then
              echo "DEPLOY_DOTENV vazio"
              exit 1
            fi
            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              mkdir -p "$(dirname "${DEPLOY_PATH}")"
              if [ -e "${DEPLOY_PATH}" ] && [ ! -d "${DEPLOY_PATH}/.git" ]; then
                if [ -d "${DEPLOY_PATH}" ] && [ -z "$(ls -A "${DEPLOY_PATH}" 2>/dev/null)" ]; then
                  rmdir "${DEPLOY_PATH}"
                else
                  echo "Erro: ${DEPLOY_PATH} já existe e não é um clone git (ou não está vazio). Ajuste ou remova e rode de novo."
                  exit 1
                fi
              fi
              git clone "$REPO_URL" "${DEPLOY_PATH}"
            fi
            cd "${DEPLOY_PATH}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            umask 077
            printf '%s\n' "${DEPLOY_DOTENV}" > .env
            docker compose $COMPOSE_OPTS --env-file .env up -d --build
            sleep 15
            docker compose $COMPOSE_OPTS --env-file .env exec -T api wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP
            if ! command -v tailscale >/dev/null 2>&1; then
              echo "tailscale não encontrado na VM"
              exit 1
            fi
            if ! sudo -n true >/dev/null 2>&1; then
              echo "sudo sem senha é necessário para configurar tailscale funnel no deploy"
              exit 1
            fi
            sudo -n tailscale funnel reset || true
            sudo -n tailscale funnel --bg --https=443 http://127.0.0.1:80
            tailscale funnel status
