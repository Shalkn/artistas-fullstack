# Valida formatação e sintaxe do Terraform em infra/terraform (sem backend remoto).
name: Terraform validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Arquivo dummy para validate (file() da connection SSH)
        run: printf '%s\n' 'ci-placeholder-not-a-real-key' > /tmp/terraform-ci-dummy-key && chmod 600 /tmp/terraform-ci-dummy-key

      - name: terraform init (sem backend remoto)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan (ci vars, sem apply)
        run: terraform plan -input=false -lock=false -refresh=false -var-file=ci.tfvars -out=/tmp/tfplan
